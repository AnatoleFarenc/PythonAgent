[project]
name = "pythonrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tree_sitter",
    "tree_sitter_python",
    "numpy",
    "rank_bm25",
    "sentence_transformers",
    "vllm>=0.33.0",
]

[tool.uv]
package = true

[project.scripts]
sandbox = "src.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "isolation: needs Docker, gVisor (runsc) and builds the sandbox image",
]

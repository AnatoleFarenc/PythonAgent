[project]
name = "pythonrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tree_sitter",
    "tree_sitter_python",
    "numpy",
    "rank_bm25",
    "sentence_transformers",
    "vllm>=0.33.0",
]

[tool.uv]
package = true

[project.scripts]
sandbox = "src.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]